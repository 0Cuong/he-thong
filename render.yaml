services:
  - type: web
    name: classroom48-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run lint && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/classroom48.db
      - key: FRONTEND_URL
        sync: false
    disk:
      name: classroom48-data
      mountPath: /var/data
      sizeGB: 1
